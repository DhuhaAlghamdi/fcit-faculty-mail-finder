<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#142e45"><meta name="description" content="ابحث عن البريد الجامعي لأعضاء هيئة التدريس بكلية الحاسبات وتقنية المعلومات بجامعة الملك عبدالعزيز."><title>FCIT Faculty Mail Finder</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="style.css"><script src="visitor-counter.js" defer></script><script src="app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">⌘</span><span>دليل الكلية<small lang="en" dir="ltr">FCIT · KAU</small></span></a><span class="university">جامعة الملك عبدالعزيز<span>كلية الحاسبات وتقنية المعلومات</span></span></header>
<main>
<section class="hero"><h1>البحث عن البريد الجامعي</h1><p>دليل أعضاء هيئة التدريس بكلية الحاسبات وتقنية المعلومات</p>
<div class="search-area"><label for="search">اسم عضو هيئة التدريس</label><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="البحث بالاسم" autocomplete="off" disabled></div></div>
<div class="filter-panel"><div class="filters" role="group" aria-label="القسم العلمي"><button data-department="CS" aria-pressed="false" disabled><span>علوم الحاسب</span><b dir="ltr">CS</b></button><button data-department="IT" aria-pressed="false" disabled><span>تقنية المعلومات</span><b dir="ltr">IT</b></button><button data-department="IS" aria-pressed="false" disabled><span>نظم المعلومات</span><b dir="ltr">IS</b></button></div>
<div class="section-filter"><div class="filters" role="group" aria-label="القسم الدراسي"><button data-section="male" aria-pressed="false" disabled>طلاب</button><button data-section="female" aria-pressed="false" disabled>طالبات</button></div></div></div>
</section>
<div id="visitor-counter" class="visitor-counter" role="status" hidden><span>عدد الزائرين</span><b id="visitor-total" dir="ltr"></b></div>
<p id="load-status" role="status">جارٍ تحميل الدليل…</p>
<section class="directory" aria-label="نتائج البحث" hidden><div class="results-heading"><h2>نتائج البحث <span id="count">0</span></h2></div><p id="status" role="status" aria-live="polite"></p><div id="results" class="grid"></div></section>
</main><div id="toast" role="status" aria-live="polite"></div>
</body></html>
